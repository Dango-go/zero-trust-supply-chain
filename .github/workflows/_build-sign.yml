name: _build-sign

on:
  workflow_call:
    inputs:
      orders_digest:
        required: true
        type: string
        description: "Digest of zt-orders image to sign"
      payments_digest:
        required: true
        type: string
        description: "Digest of zt-payments image to sign"
      registry_url:
        required: true
        type: string
        description: "Base URL of Google Artifact Registry"

permissions: {}

jobs:
  sign-and-attest:
    name: Cosign Keyless Sign & Attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    # id-token:write is required for both Sigstore Fulcio and GCP WIF
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ vars.GAR_LOCATION || 'europe-west1' }}-docker.pkg.dev
          username: 'oauth2accesstoken'
          password: ${{ steps.auth.outputs.access_token }}

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          cosign-release: "v2.4.3"


      # Download SBOM and Vulnerability artifacts from previous phases

      - name: Download SBOM Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: sbom-reports
          path: ./artifacts/sbom # local path of where artifacts on runner

      - name: Download Vulnerability Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: vuln-reports
          path: ./artifacts/vuln


      # 1. SIGN & ATTEST: zt-orders

      - name: Sign & Attest zt-orders (Keyless Sigstore to GAR)
        env:
          IMG: "${{ inputs.registry_url }}/zt-orders@${{ inputs.orders_digest }}"
          SBOM_FILE: "./artifacts/sbom/sbom-orders.cdx.json"
          VULN_FILE: "./artifacts/vuln/vuln-orders.json"
        run: |
          echo "==> Signing zt-orders by digest: $IMG"
          cosign sign --yes "$IMG"

          echo "==> Attesting CycloneDX SBOM..."
          cosign attest --yes --type cyclonedx --predicate "$SBOM_FILE" "$IMG"

          echo "==> Attesting Vulnerability Scan Report..."
          cosign attest --yes --type vuln --predicate "$VULN_FILE" "$IMG"


      # 2. SIGN & ATTEST: zt-payments

      - name: Sign & Attest zt-payments (Keyless Sigstore to GAR)
        env:
          IMG: "${{ inputs.registry_url }}/zt-payments@${{ inputs.payments_digest }}"
          SBOM_FILE: "./artifacts/sbom/sbom-payments.cdx.json"
          VULN_FILE: "./artifacts/vuln/vuln-payments.json"
        run: |
          echo "==> Signing zt-payments by digest: $IMG"
          cosign sign --yes "$IMG"

          echo "==> Attesting CycloneDX SBOM..."
          cosign attest --yes --type cyclonedx --predicate "$SBOM_FILE" "$IMG"

          echo "==> Attesting Vulnerability Scan Report..."
          cosign attest --yes --type vuln --predicate "$VULN_FILE" "$IMG"

      - name: Verification Summary
        run: |
          echo "All images successfully signed and attested in Google Artifact Registry!"
          echo "Fulcio OIDC identity and Rekor transparency logs attached."

