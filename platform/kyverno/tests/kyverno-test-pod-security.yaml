apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-pod-security-restricted
policies:
  - ../policies/04-pod-security-restricted.yaml
resources:
  - resources.yaml
results:
  - policy: pod-security-restricted
    rule: require-run-as-non-root
    resource: good-pinned-pod
    kind: Pod
    result: pass
  - policy: pod-security-restricted
    rule: require-readonly-rootfs
    resource: good-pinned-pod
    kind: Pod
    result: pass
  - policy: pod-security-restricted
    rule: drop-all-capabilities
    resource: good-pinned-pod
    kind: Pod
    result: pass
  - policy: pod-security-restricted
    rule: disallow-privilege-escalation
    resource: good-pinned-pod
    kind: Pod
    result: pass
  - policy: pod-security-restricted
    rule: require-run-as-non-root
    resource: bad-root-pod
    kind: Pod
    result: fail
  - policy: pod-security-restricted
    rule: disallow-privilege-escalation
    resource: bad-root-pod
    kind: Pod
    result: fail
