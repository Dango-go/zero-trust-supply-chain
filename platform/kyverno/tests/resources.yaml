apiVersion: v1
kind: Pod
metadata:
  name: good-pinned-pod
  namespace: zt-apps
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: zt-orders
      image: europe-west1-docker.pkg.dev/security-supply-chain/zero-trust/zt-orders@sha256:7f9a8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
