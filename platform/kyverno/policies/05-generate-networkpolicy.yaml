apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-networkpolicy
  labels:
    app.kubernetes.io/part-of: zero-trust-supply-chain
    security-tier: zero-trust
  annotations:
    policies.kyverno.io/title: "Auto-Generate Default-Deny CiliumNetworkPolicy"
    policies.kyverno.io/category: "Network Security"
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/description: >
      Automatically generates a baseline Default-Deny CiliumNetworkPolicy whenever
      a new application namespace (e.g. zt-*) is created.
spec:
  rules:
    - name: auto-generate-cilium-default-deny
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - "zt-*"
      generate:
        apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        name: default-deny-all
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            description: "Auto-generated by Kyverno: Default-deny all traffic"
            endpointSelector: {}
            ingress: []
            egress: []
