apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: orders-db-dynamic-secret
  namespace: zt-apps
spec:
  vaultAuthRef: orders-vault-auth
  path: database/creds/orders-rw
  destination:
    createSecret: true
    name: orders-db-creds

  restartTarget:
    kind: Deployment
    name: zt-orders