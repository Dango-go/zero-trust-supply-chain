apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: orders-vault-auth
  namespace: zt-apps
  labels:
    app.kubernetes.io/name: zt-orders
    app.kubernetes.io/part-of: zero-trust-supply-chain
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: orders-role
    serviceAccount: zt-orders-sa
    tokenTTL: 1h