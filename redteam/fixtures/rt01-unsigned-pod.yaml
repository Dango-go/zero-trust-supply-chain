apiVersion: v1
kind: Pod
metadata:
  name: rt01-unsigned-probe
  namespace: zt-apps
  labels:
    app.kubernetes.io/name: rt01-unsigned-probe
    app.kubernetes.io/part-of: zero-trust-supply-chain
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: ${RT01_IMAGE}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
