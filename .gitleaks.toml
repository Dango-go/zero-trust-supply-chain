title = "Zero-Trust Supply Chain Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlists for test fixtures and documentation"
paths = [
  '''redteam/fixtures/.*''',
  '''docs/.*''',
  '''PLAN\.md''',
  '''\.gitleaks\.toml'''
]
regexes = [
  '''(?i)dummy[_-]?token''',
  '''(?i)mock[_-]?secret''',
  '''(?i)test[_-]?password'''
]
