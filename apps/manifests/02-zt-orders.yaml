apiVersion: v1
kind: ServiceAccount
metadata:
  name: zt-orders-sa
  namespace: zt-apps
  labels:
    app.kubernetes.io/name: zt-orders
automountServiceAccountToken: true # Needed if connecting to Vault via Kubernetes Auth
---
apiVersion: v1
kind: Service
metadata:
  name: zt-orders
  namespace: zt-apps
  labels:
    app.kubernetes.io/name: zt-orders
    app.kubernetes.io/part-of: zero-trust-supply-chain
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zt-orders
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zt-orders
  namespace: zt-apps
  labels:
    app.kubernetes.io/name: zt-orders
    app.kubernetes.io/part-of: zero-trust-supply-chain
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zt-orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zt-orders
        app.kubernetes.io/part-of: zero-trust-supply-chain
    spec:
      serviceAccountName: zt-orders-sa

      # Pod-level security context (Restricted PSA)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: zt-orders
          # Must be pinned by digest in production (or populated by CI/CD)
          image: europe-west1-docker.pkg.dev/security-supply-chain/zero-trust/zt-orders:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: SERVICE_NAME
              value: "zt-orders"
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PAYMENTS_SERVICE_URL
              value: "http://zt-payments.zt-apps.svc.cluster.local:8080"
            - name: DB_HOST
              value: "postgres.zt-data.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "orders"
            - name: VAULT_CREDS_FILE
              value: "/vault/secrets/db-creds.txt"

          # Container-level security context (Restricted PSA)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Resource limits strictly enforced
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Health Probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # Volume mounts for read-only rootfs & Vault Secrets Operator target
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true

      volumes:
        - name: tmp
          emptyDir: {}
        # EmptyDir or VaultDynamicSecret secret projection
        - name: vault-secrets
          emptyDir:
            medium: Memory
