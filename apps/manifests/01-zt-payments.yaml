apiVersion: v1
kind: ServiceAccount
metadata:
  name: zt-payments-sa
  namespace: zt-apps
  labels:
    app.kubernetes.io/name: zt-payments
automountServiceAccountToken: false # Disable default token mounting (Zero-Trust)
---
apiVersion: v1
kind: Service
metadata:
  name: zt-payments
  namespace: zt-apps
  labels:
    app.kubernetes.io/name: zt-payments
    app.kubernetes.io/part-of: zero-trust-supply-chain
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zt-payments
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zt-payments
  namespace: zt-apps
  labels:
    app.kubernetes.io/name: zt-payments
    app.kubernetes.io/part-of: zero-trust-supply-chain
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zt-payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zt-payments
        app.kubernetes.io/part-of: zero-trust-supply-chain
    spec:
      serviceAccountName: zt-payments-sa
      automountServiceAccountToken: false

      # Pod-level security context (Restricted PSA)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: zt-payments
          # Must be pinned by digest in production (or populated by CI/CD kustomize/helm)
          image: europe-west1-docker.pkg.dev/security-supply-chain/zero-trust/zt-payments:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          # Container-level security context (Restricted PSA)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Resource limits strictly enforced
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Health Probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # Ephemeral tmp volume for readOnlyRootFilesystem compatibility
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
